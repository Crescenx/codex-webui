<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Viewer · Architecture Atlas</title>
<style>
:root{color-scheme:light;--ink:#192d40;--muted:#536779;--line:#ccd7de;--accent:#006b72;--paper:#f5f7f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;height:100vh;min-width:1180px;display:grid;grid-template-rows:90px 58px 1fr}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 11px}button:hover{background:#e3f2f1;border-color:var(--accent)}:focus-visible{outline:3px solid #db8c18;outline-offset:3px}header{padding:16px 26px;background:#142d3e;color:white;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0;letter-spacing:-.6px}header p{margin:3px 0;color:#bcd1df;font-size:12px}.eyebrow{font:11px monospace;letter-spacing:2px;color:#8ad6ce}.stats{font:13px monospace;text-align:right}.toolbar{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);background:white}.toolbar .active{background:var(--accent);color:white}.toolbar .spacer{flex:1}#zoom{font:12px monospace;width:48px;text-align:center}main{min-height:0;display:grid;grid-template-columns:245px minmax(460px,1fr) 350px}nav,aside{overflow:auto;background:white;padding:18px;border-right:1px solid var(--line)}aside{border-left:1px solid var(--line);border-right:0;padding:22px}nav label{font-size:12px;color:var(--muted)}input{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;margin:6px 0 12px}nav button{display:block;width:100%;text-align:left;margin:5px 0;overflow-wrap:anywhere;font-size:12px}nav button.selected{border-color:var(--accent);background:#e3f2f1}nav .group{font-weight:650;font-size:13px}nav small{color:var(--muted)}#stage{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}#caption{padding:12px 18px;background:#edf3f5;border-bottom:1px solid var(--line);font-size:12px;min-height:58px}#viewport{overflow:auto;flex:1;min-height:0;overscroll-behavior:none;scroll-axis-lock:none;background-image:radial-gradient(#b9cbd6 .7px,transparent .7px);background-size:20px 20px;cursor:grab}#viewport.dragging{cursor:grabbing}svg{display:block;user-select:none}svg text{font-family:system-ui,sans-serif;fill:var(--ink)}.node{cursor:pointer}.node rect{fill:white;stroke:#a6bdc9;stroke-width:1.4}.node:hover rect,.node:focus rect{stroke:#006b72;stroke-width:3}.node.chosen rect{fill:#e4f3ef;stroke:#006b72;stroke-width:3}.node.dim{opacity:.22}.edge{fill:none;stroke:#a2b2bc;stroke-width:1.5}.edge.hot{stroke:#007b80;stroke-width:2.8}.edge.dim{opacity:.07}.edge.http{stroke-dasharray:9 4}.edge.callback{stroke-dasharray:3 4}.edge.data,.edge.type{stroke-dasharray:2 5}.edge-label{font-size:11px;paint-order:stroke;stroke:#f5f7f8;stroke-width:4px;stroke-linejoin:round}.tag{display:inline-block;background:#edf2f5;border-radius:4px;padding:2px 6px;font:11px monospace;margin:2px}h2{font-size:20px;line-height:1.3;margin:3px 0 12px}h3{font-size:13px;margin:22px 0 8px;color:#006b72}p{margin:8px 0}code{font:12px/1.7 ui-monospace,monospace;overflow-wrap:anywhere}aside .link{display:block;width:100%;text-align:left;margin:5px 0;font-size:12px;overflow-wrap:anywhere}.relation{padding:10px 0;border-bottom:1px solid #e3e9ed}.relation small{display:block;color:var(--muted);overflow-wrap:anywhere}#foot{padding:7px 16px;font-size:11px;border-top:1px solid var(--line);background:white;color:var(--muted)}.step{border-left:3px solid #d39737;padding:4px 12px;margin:15px 0}.empty{color:var(--muted);font-size:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}.legend span{white-space:nowrap}details{margin:10px 0}summary{cursor:pointer;font-weight:600}#reset{white-space:nowrap}
</style>
<header><div><div class="eyebrow">ENGINEERING / SOURCE ATLAS</div><h1>Codex Viewer · 架构地图</h1><p>从用户操作到原生执行，再下钻到每一个源码模块。</p></div><div class="stats" id="stats"></div></header>
<div class="toolbar"><button data-mode="runtime" class="active">01 系统耦合</button><button data-mode="imports">02 源码依赖</button><button data-mode="flows">03 关键链路</button><select id="flow" aria-label="选择关键链路" hidden></select><span class="spacer"></span><button id="out" aria-label="缩小">−</button><span id="zoom">100%</span><button id="in" aria-label="放大">＋</button><button id="fit">适应画布</button><button id="reset">返回总览</button></div>
<main><nav><label for="search">搜索文件、模块或导出符号</label><input id="search" placeholder="例如 hybrid / reduceNotice"><div id="catalog"></div></nav><section id="stage"><div id="caption"></div><div id="viewport" tabindex="0" role="region" aria-label="架构图，可用方向键平移，加减键缩放"><svg id="graph" xmlns="http://www.w3.org/2000/svg" aria-label="模块关系图"></svg></div><div id="foot">拖动画布平移 · Ctrl / ⌘ + 滚轮缩放 · 点击节点查看上下游 · 双击模块展开文件 · 方向键平移</div></section><aside id="detail" aria-live="polite"></aside></main>
<script>
const D=/*ARCHITECTURE_DATA*/;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G=new Map(D.groups.map(g=>[g.id,g])),N=new Map(D.nodes.map(n=>[n.id,n]));
let mode='runtime',selected=null,scope=null,scale=1,width=1900,height=950;
const colors=['#007b80','#4668a2','#aa6d16','#8b5b92'];
const flows=[
 {name:'发送消息与流式恢复',ids:['ui','state','client','http','runtime','adapter','native','shared'],steps:['Composer 调用 store 发送操作，保留该会话草稿与设置；不是组件自行 fetch。','client 发 HTTP 请求；main 验证身份、目录、权限及当前会话状态，再调用 RuntimeServers。','RuntimeServers 选择后端，AppServer 通过 stdio JSON-RPC 提交原生轮次。','原生 notice 经 adapter → runtime → main 归并、编号，再通过 SSE → client → store → UI。','打开会话时先缓冲事件，再接收带 seq 的快照并重放较新事件；断线/超时只查询，不盲目重发。']},
 {name:'审批与权限',ids:['ui','state','client','http','policy','shared','runtime','adapter','native'],steps:['原生 runtime 发出带 ID 的 server request，RuntimeServers 保存其后端归属。','main 建立 pending 请求；shared 审批结构交给 store 与 ApprovalCard / QuestionCard。','用户选择通过 HTTP 回传，服务端只接受该请求提供的选项与合法回答。','RuntimeServers 将 reply 路由回原始 runtime；resolved 事件消除 pending。权限设置与执行沙箱由原生后端落实。']},
 {name:'托管子任务与合并',ids:['native','mcp','http','hybrid','workspace','runtime','adapter','disk','ui'],steps:['原生主任务调用 viewer_agents MCP；bridge 带内部令牌及调用信息回调 main。','main 校验调用者，HybridSessions 记录稳定 operationId 与操作收据。','AgentWorkspaces 建立独立副本；hybrid 经 main 注入的 hooks 创建并提交原生子会话。','事件更新逻辑会话与子任务面板，完成结果回送父任务。','先 agent_changes 检查 revision，再 apply_agent 三方合并；未知结果需核对收据，冲突不静默覆盖。']},
 {name:'Watchdog / 原生 Goal',ids:['ui','state','http','watch','disk','runtime','adapter','native','mcp'],steps:['Watchdog 配置与运行记录写入 watchdogs.sqlite；main 的调度循环决定何时启动原生轮次。','调度与运行中会话、待审批、活跃 Goal 和重启协调，避免重复派发。','scheduled turn 调用 watchdog_report，经 MCP → main → Watchdogs 记录 continue / complete / needs_input。','Goal 是另一条原生 thread/goal/get/set/clear 链路，不通过 Watchdog MCP 包装；激活前同步权限与待交付历史。']},
 {name:'Obsidian 与会话引用',ids:['plugin','ui','state','http','vault','refs','mcp','native','disk'],steps:['Obsidian main 配对并将凭据放入 SecretStorage；desktopClient 通过 Node HTTP/Bearer 连接服务。','VaultApp 注入同一 store 契约并复用 Vue 组件；environment 适配独立窗口和文件打开。','讨论文章/选区只预填草稿，不自动发送全文或改写笔记。','References 绑定来源与目标会话；原生任务通过 references MCP 只读访问授权历史，游标限制读取范围。']},
 {name:'Markdown 与构建生命周期',ids:['ui','render','present','shared','config','plugin'],steps:['MessageBody 将原文与数学宏上下文交给 markdown-client；队列通过 postMessage 发送到 Worker。','markdown.worker 调用 markdown：remark 解析 → rehype 清洗 → 数学排版/代码高亮 → 分块结果与源码映射。','renderInto 增量挂载 DOM；Mermaid 按需渲染，复制使用原文映射。transcript 管理展示缓存，不能取代 canonical history。','Vite 浏览器构建 worker 资源；Obsidian 构建内联 worker 并外置宿主模块。build 不重启服务，也不表示插件已安装。']},
];
$('#flow').innerHTML=flows.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');
$('#stats').innerHTML=`${D.groups.length} 个架构分区 · ${D.nodes.length} 个文件<br>${D.edges.length} 条源码依赖 · ${D.relations.length} 条系统关系`;
function label(id){return G.get(id)?.label||id}
function btn(id,text){return `<button class="link" data-id="${esc(id)}">${esc(text||label(id))}</button>`}
function catalog(){const q=$('#search').value.trim().toLowerCase();let html='';
 if(q){const found=D.nodes.filter(n=>(n.id+' '+n.exports.join(' ')+' '+G.get(n.group).label).toLowerCase().includes(q));html=`<small>${found.length} 个匹配文件</small>`+found.map(n=>btn(n.id)).join('');}
 else html=D.groups.map(g=>`<button class="group ${selected===g.id?'selected':''}" data-id="${g.id}">${esc(g.label)} <small>${D.nodes.filter(n=>n.group===g.id).length||'外部'}</small></button>`).join('');
 $('#catalog').innerHTML=html||'<p class="empty">没有匹配结果</p>';}
function intro(){return `<div class="eyebrow" style="color:#006b72">READ THE SYSTEM</div><h2>先看边界，再读实现</h2><p>执行主线从左向右：UI → 状态 → 传输 → HTTP → runtime → 原生子进程。</p><p>点击节点高亮直接关系，右侧解释职责、协议、状态所有权和证据。双击或“展开文件”进入模块内部。</p><h3>需要优先理解的耦合</h3><p><b>main 是组装中心。</b>除了调用领域服务，它还注入执行 hooks；不能只看 import 判断调用方向。</p><p><b>shared 是共同契约。</b>修改事件归并或 DTO 会影响前后端。类型依赖不代表运行时调用。</p><p><b>插件复用状态和组件。</b>浏览器与 Obsidian 使用不同传输与凭据。</p><h3>证据边界</h3><p>当前工作区快照，包含未提交文件；HEAD ${esc(D.revision)}。不是线上部署状态或动态调用追踪。</p><p>生成于 ${esc(D.generated)}。</p><p>源码依赖由 TypeScript AST 提取 import/export/dynamic import；记录整文件依赖，不推断每个函数的调用。CSS 选择器、模板事件、计算路径及外部项目内部实现不自动建边。</p><p>文档自身 build/template/check 不计入产品源码清单。运行时关系由源码人工核对。</p>`;}
function inspect(){const panel=$('#detail');if(!selected){panel.innerHTML=mode==='flows'?`<h2>${flows[$('#flow').value].name}</h2>`+flows[$('#flow').value].steps.map((s,i)=>`<div class="step"><b>0${i+1}</b><p>${s}</p></div>`).join('')+intro():intro();return;}
 if(G.has(selected)){const g=G.get(selected),files=D.nodes.filter(n=>n.group===g.id),rels=D.relations.filter(e=>e.from===g.id||e.to===g.id);
 panel.innerHTML=`<span class="tag">模块 / ${esc(g.id)}</span><h2>${g.label}</h2><p>${esc(g.description)}</p><code>${esc(g.scope)}</code>${files.length?'<p><button id="expand">展开文件依赖</button></p>':''}<h3>运行时耦合 · ${rels.length}</h3>`+rels.map(e=>`<div class="relation"><b>${esc(label(e.from))} → ${esc(label(e.to))}</b><br><span class="tag">${e.kind}</span> ${esc(e.label)}<p>${esc(e.detail)}</p><small>证据：${esc(e.evidence)}</small>${btn(e.from===g.id?e.to:e.from,'查看 '+label(e.from===g.id?e.to:e.from))}</div>`).join('')+`<h3>全部文件 · ${files.length}</h3>`+files.map(n=>btn(n.id)).join('');
 $('#expand')?.addEventListener('click',()=>{mode='imports';scope=g.id;selected=null;render();fit()});
 }else{const n=N.get(selected),out=D.edges.filter(e=>e.from===n.id),inc=D.edges.filter(e=>e.to===n.id);
 panel.innerHTML=`<span class="tag">${esc(G.get(n.group).label)} · ${n.lines} 行</span><h2 style="overflow-wrap:anywhere">${esc(n.id)}</h2><p>${esc(G.get(n.group).description)}</p>${btn(n.group,'返回所属模块')}<h3>导出符号</h3><p>${n.exports.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'没有命名导出（入口、组件、声明或资源文件）'}</p><h3>依赖下游 · ${out.length}</h3>`+out.map(e=>btn(e.to,`${e.kind} → ${e.to}（本文件 L${e.line}）`)).join('')+`<h3>被谁依赖 · ${inc.length}</h3>`+inc.map(e=>btn(e.from,`${e.from}:${e.line} → ${e.kind}`)).join('')+`<h3>外部包 / 平台模块 · ${n.external.length}</h3>`+n.external.map(e=>`<div><code>${esc(e.spec)}</code> <span class="tag">${e.kind} · L${e.line}</span></div>`).join('')+`<h3>读取提示</h3><p>箭头从导入方指向被导入方。虚线 type 为纯类型声明，dynamic 为按需加载。混合导入归入 import。此邻域包含测试引用；依赖边不等于运行时调用次数。</p>`;
 }}
function graphData(){
 if(mode==='imports'&&(scope||N.has(selected))){const focus=N.get(selected);let ids=new Set(focus?[focus.id,...D.edges.filter(e=>e.from===focus.id||e.to===focus.id).flatMap(e=>[e.from,e.to])]:D.nodes.filter(n=>n.group===scope).map(n=>n.id));
 const ns=[...ids].map(id=>N.get(id));const columns=focus?3:Math.min(4,Math.max(1,Math.ceil(ns.length/10)));const counts=Array(columns).fill(0);
 const nodes=ns.map((n,i)=>{let col=focus?(n.id===focus.id?1:D.edges.some(e=>e.from===n.id&&e.to===focus.id)?0:2):i%columns;return {...n,label:n.id,x:col*390+50,y:counts[col]++*115+60};});return {nodes,edges:D.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)),w:columns*390+80,h:Math.max(4,...counts)*115+110};}
 let nodes=D.groups,edges=D.relations;
 if(mode==='imports'){const aggregate=new Map();for(const e of D.edges){const from=N.get(e.from).group,to=N.get(e.to).group;if(from===to)continue;const key=from+'|'+to;const v=aggregate.get(key)||{from,to,kind:'import',count:0};v.count++;aggregate.set(key,v);}edges=[...aggregate.values()].map(e=>({...e,label:`${e.count} 条依赖`}));}
 if(mode==='flows'){const ids=flows[$('#flow').value].ids;nodes=D.groups.filter(g=>ids.includes(g.id));edges=D.relations.filter(e=>ids.includes(e.from)&&ids.includes(e.to));}
 return {nodes:nodes.map(g=>({...g,x:g.x*310+45,y:g.y*210+65})),edges,w:1900,h:950};
}
function draw(){const data=graphData();width=data.w;height=data.h;const pos=new Map(data.nodes.map(n=>[n.id,n]));const near=new Set([selected]);data.edges.filter(e=>e.from===selected||e.to===selected).forEach(e=>{near.add(e.from);near.add(e.to)});
 const svg=$('#graph');svg.setAttribute('viewBox',`0 0 ${width} ${height}`);let html='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#678b9e"/></marker></defs>';
 for(const e of data.edges){const a=pos.get(e.from),b=pos.get(e.to);if(!a||!b)continue;const hot=e.from===selected||e.to===selected;const dx=b.x-a.x,dy=b.y-a.y;let x1=a.x+125,y1=a.y+76,x2=b.x+125,y2=b.y;
 if(Math.abs(dx)>Math.abs(dy)){x1=a.x+(dx>0?250:0);y1=a.y+38;x2=b.x+(dx>0?0:250);y2=b.y+38;}
 const bend=Math.max(40,Math.abs(x2-x1)/2);const d=Math.abs(dx)>Math.abs(dy)?`M${x1},${y1} C${x1+Math.sign(dx)*bend},${y1} ${x2-Math.sign(dx)*bend},${y2} ${x2},${y2}`:`M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}`;
 html+=`<path class="edge ${e.kind} ${selected?(hot?'hot':'dim'):''}" d="${d}" marker-end="url(#arrow)"><title>${esc(label(e.from)+' → '+label(e.to)+' : '+(e.label||e.kind))}</title></path>`;
 if(hot)html+=`<text class="edge-label" x="${(x1+x2)/2}" y="${(y1+y2)/2-6}" text-anchor="middle">${esc(e.label||e.kind)}</text>`;}
 for(const n of data.nodes){const isFile=N.has(n.id),g=isFile?G.get(n.group):n;const title=isFile?n.id.split('/').at(-1):n.label;const sub=isFile?n.id.slice(0,n.id.lastIndexOf('/')):n.scope;const count=D.nodes.filter(f=>f.group===n.id).length;
 html+=`<g class="node ${selected===n.id?'chosen':''} ${selected&&!near.has(n.id)?'dim':''}" data-node="${esc(n.id)}" transform="translate(${n.x},${n.y})" tabindex="0" role="button" aria-label="${esc(n.label)}"><title>${esc(isFile?n.id:n.description)}</title><rect width="250" height="76" rx="8"/><rect width="5" height="76" rx="2" style="fill:${colors[(g.y||0)%4]};stroke:none"/><text x="16" y="29" font-size="15" font-weight="650">${esc(title.length>29?title.slice(0,27)+'…':title)}</text><text x="16" y="50" font-size="10">${esc(sub.length>36?sub.slice(0,34)+'…':sub)}</text><text x="234" y="66" text-anchor="end" font-size="10">${isFile?n.lines+' lines':count?count+' files':'external'}</text></g>`;}
 svg.innerHTML=html;resize();
}
function resize(){const s=$('#graph');s.style.width=width*scale+'px';s.style.height=height*scale+'px';$('#zoom').textContent=Math.round(scale*100)+'%';}
function zoom(value,cx,cy){const v=$('#viewport'),r=v.getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;const x=(v.scrollLeft+cx)/scale,y=(v.scrollTop+cy)/scale;scale=Math.max(.2,Math.min(2.5,value));resize();v.scrollLeft=x*scale-cx;v.scrollTop=y*scale-cy;}
function fit(){const v=$('#viewport');scale=Math.max(.2,Math.min(1,(v.clientWidth-30)/width,(v.clientHeight-30)/height));resize();v.scrollTo(0,0);}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#flow').hidden=mode!=='flows';$('#caption').innerHTML=mode==='imports'?'<b>源码依赖</b> · 箭头：导入方 → 被导入方。总览聚合跨模块边；展开模块查看内部边；选中文件查看完整一跳邻域。':mode==='flows'?'<b>'+esc(flows[$('#flow').value].name)+'</b> · 下图为参与模块的耦合子图，右侧编号解释实际先后次序。':'<b>系统耦合总览</b> · 箭头表示依赖/发起方向；HTTP/SSE 和 hooks 可双向传递。点击节点读取具体语义。<div class="legend"><span>━━ 调用 / 契约 / 构建</span><span>┄┄ HTTP / SSE</span><span>··· 回调 / 持久化</span></div>';catalog();draw();inspect();}
function select(id){selected=id;if(N.has(id)){mode='imports';scope=N.get(id).group;}render();if(N.has(id))fit();}
let lastNodeClick={id:null,time:0};
document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(b.dataset.id);const n=e.target.closest('[data-node]');if(n){const id=n.dataset.node,now=performance.now();if(G.has(id)&&lastNodeClick.id===id&&now-lastNodeClick.time<450){mode='imports';scope=id;selected=null;lastNodeClick={id:null,time:0};render();fit();}else{lastNodeClick={id,time:now};select(id);}}});
$('#graph').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-node]');if(n){e.preventDefault();select(n.dataset.node);}}});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected=null;scope=null;render();fit();});
$('#search').oninput=catalog;$('#flow').onchange=()=>{selected=null;render();fit();};$('#in').onclick=()=>zoom(scale*1.2);$('#out').onclick=()=>zoom(scale/1.2);$('#fit').onclick=fit;$('#reset').onclick=()=>{selected=null;scope=null;$('#search').value='';render();fit();};
const viewport=$('#viewport');viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const r=viewport.getBoundingClientRect();zoom(scale*Math.exp(-e.deltaY*.002),e.clientX-r.left,e.clientY-r.top);}},{passive:false});
let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-node]'))return;const r=viewport.getBoundingClientRect();if(e.clientX-r.left>=viewport.clientWidth||e.clientY-r.top>=viewport.clientHeight)return;drag={x:e.clientX,y:e.clientY};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');});
viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft-=e.clientX-drag.x;viewport.scrollTop-=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};});
for(const event of ['pointerup','pointercancel','lostpointercapture'])viewport.addEventListener(event,()=>{drag=null;viewport.classList.remove('dragging');});
viewport.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='='){e.preventDefault();zoom(scale*1.2);}if(e.key==='-'){e.preventDefault();zoom(scale/1.2);}if(e.key==='0'){e.preventDefault();fit();}});
render();fit();
</script></html>
